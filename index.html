<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Cult Movies Collector</title>

<!-- Favicon Standard per Browser Desktop -->
<link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1">

<!-- Supporto per Apple iOS (Icona funzionante sulla Home) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TheCultMoviesApp">

<!-- Collegamento al Manifest per Android, Chrome e altri browser -->
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#000000">

<style>
/* 1. RESET SCHERMO INTERO - Blocca qualsiasi barra bianca o rimbalzo */
html, body { 
  margin: 0; 
  padding: 0; 
  width: 100%; 
  height: 100dvh; /* Usa l'altezza dinamica per eliminare lo scorrimento del browser */
  background-color: #000000; 
  color: #ffffff; 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden; /* Impedisce fisicamente al browser di muoversi */
  box-sizing: border-box;
}

/* 2. SCHERMATA INIZIALE (Prima dell'installazione) */
.welcome-screen {
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center;
  text-align: center; 
  height: 100%;
  width: 100%;
  padding: 24px;
  box-sizing: border-box;
}
.welcome-screen p {
  color: #aaaaaa;
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 25px;
}

.btn-install {
  background-color: #ffffff; 
  color: #000000; 
  font-weight: bold;
  padding: 14px 28px; 
  border-radius: 8px; 
  border: none;
  cursor: pointer; 
  font-size: 16px; 
  text-decoration: none;
  display: inline-block;
}

/* 3. CONTENITORE DELL'APP REALE */
.app-container {
  display: none; /* Diventa attivo via JS solo se aperto dalla Home dello schermo */
  width: 100%;
  height: 100%;
  position: relative;
}

/* L'iframe che ingloba Google Apps Script a tutto schermo sotto i menu */
.app-frame {
  width: 100%;
  height: 100%;
  border: none;
  padding-top: calc(env(safe-area-inset-top, 20px) + 15px);   /* Spazio ridotto per l'header sfocato pulito */
  padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 65px); /* Spazio per la barra in basso */
  box-sizing: border-box;
  background-color: #000000;
}

/* 4. TESTATA SUPERIORE SFOCATA (Stile Amazon/Apple) */
.app-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  background-color: rgba(0, 0, 0, 0.6); 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px); /* Compatibilità iOS */
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: env(safe-area-inset-top, 20px); 
  padding-bottom: 12px;
  text-align: center;
}

/* 5. BARRA INFERIORE FISSA (Sfondo nero protettivo sempre attivo per le bande) */
.app-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  background-color: #111111;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-top: 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 6px);
}

.nav-item {
  color: #aaaaaa;
  text-decoration: none;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.nav-item.active {
  color: #ffffff;
  font-weight: bold;
}
.nav-svg {
  width: 22px;
  height: 22px;
  stroke: #aaaaaa;
  transition: stroke 0.2s;
}
.nav-item.active .nav-svg {
  stroke: #ffffff;
}
</style>
</head>
<body>

  <!-- SCHERMATA DI BENVENUTO (Si vede solo se aperta nel normale browser) -->
  <div id="welcomeScreen" class="welcome-screen">
    <p>Per avviare l'applicazione a schermo intero senza barre del browser, aggiungila alla schermata Home del tuo telefono e aprila da lì.</p>
    <a href="https://google.com" class="btn-install">
      Apri nel Browser
    </a>
  </div>

  <!-- INTERFACCIA APP NATIVA (Si attiva quando viene aperta dalla Home del telefono) -->
  <div id="appInterface" class="app-container">
    <!-- Testata fissa vuota sfocata per proteggere l'area dell'ora/batteria -->
    <header class="app-header"></header>

    <!-- L'iframe caricato immediatamente -->
    <iframe id="appFrame" class="app-frame" src="https://google.com"></iframe>

    <!-- Barra inferiore fissa con i tuoi pulsanti SVG pronti -->
    <footer class="app-footer" id="appFooter">
      <a href="#" class="nav-item active" onclick="changeAppPage('catalogo', this)">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span>Catalogo</span>
      </a>
      <a href="#" class="nav-item" onclick="changeAppPage('preordini', this)">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>Preordini</span>
      </a>
      <a href="#" class="nav-item" onclick="changeAppPage('profilo', this)">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profilo</span>
      </a>
    </footer>
  </div>

<script>
  // 1. Controllo apertura da Schermata Home (PWA)
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('appInterface').style.display = 'block'; // Accende subito l'interfaccia!
  }

  // 2. Funzione per inviare comandi di cambio pagina all'iframe di Google Script
  function changeAppPage(pageName, element) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');

    const iframe = document.getElementById('appFrame');
    // Invia il messaggio in modo sicuro a Google Apps Script
    iframe.contentWindow.postMessage({ action: 'navigate', page: pageName }, '*');
  }
</script>
</body>
</html>
