<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Cult Movies Collector</title>

    <!-- Favicon Standard per Browser Desktop (Usa le tue icone) -->
    <link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1">

    <!-- Supporto per Apple iOS (La riga del tuo test funzionante adattata al tuo file) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TheCultMoviesApp">

    <!-- Collegamento al Manifest per Android, Chrome e altri browser -->
    <link rel="manifest" href="manifest.json?v=1">

    <!-- Colore della barra del browser su Android -->
    <meta name="theme-color" content="#000000">

    <style>
        /* Forza l'applicazione a riempire lo schermo senza spostamenti */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            height: 100dvh; /* Forza l'altezza dinamica sui dispositivi mobili */
            overflow: hidden; 
            background-color: #000000; 
            position: fixed; /* Evita sobbalzi o scorrimenti della pagina guscio */
            top: 0;
            left: 0;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            height: 100dvh;
            border: none; 
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Sostituisci l'URL qui sotto con il link reale della tua Web App di Google Script (lascia le virgolette) -->
    <iframe src="https://script.google.com/macros/s/AKfycbxYFekITzqlN8TMB8PBukJxOYydrzkO2oFlY7t6w-rHMSyDf_prx0fg86uks28FFdGb/exec"></iframe>

</body>
</html>
