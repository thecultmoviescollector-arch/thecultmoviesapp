<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Cult Movies Collector</title>

<!-- Favicon Standard per Browser Desktop -->
<link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1">

<!-- Supporto per Apple iOS (Icona funzionante sulla Home) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TheCultMoviesApp">

<!-- Collegamento al Manifest per Android, Chrome e altri browser -->
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#000000">

<style>
/* 1. RESET SCHERMO INTERO - Blocca qualsiasi barra bianca o rimbalzo */
html, body { 
  margin: 0; 
  padding: 0; 
  width: 100%; 
  height: 100dvh; /* Usa l'altezza dinamica per eliminare lo scorrimento del browser */
  background-color: #000000; 
  color: #ffffff; 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden; /* Impedisce fisicamente al browser di muoversi */
  box-sizing: border-box;
}

/* 2. SCHERMATA INIZIALE (Prima dell'installazione) */
.welcome-screen {
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center;
  text-align: center; 
  height: 100%;
  width: 100%;
  padding: 24px;
  box-sizing: border-box;
}
.welcome-screen p {
  color: #aaaaaa;
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 25px;
}

.btn-install {
  background-color: #ffffff; 
  color: #000000; 
  font-weight: bold;
  padding: 14px 28px; 
  border-radius: 8px; 
  border: none;
  cursor: pointer; 
  font-size: 16px; 
  text-decoration: none;
  display: inline-block;
}

/* 3. CONTENITORE DELL'APP REALE (Nascosto all'inizio, si attiva dalla Home) */
.app-container {
  display: none; /* Diventa block via JavaScript se aperta dalla home */
  width: 100%;
  height: 100%;
  position: relative;
}

/* L'iframe che ingloba Google Apps Script a tutto schermo sotto i menu */
.app-frame {
  width: 100%;
  height: 100%;
  border: none;
  /* Spazio per l'header superiore (circa 52px totali) */
  padding-top: calc(env(safe-area-inset-top, 20px) + 32px);   
  /* Spazio esatto occupato dalla maschera in basso (0px su PC, ~34px su iPhone) */
  padding-bottom: env(safe-area-inset-bottom, 0px); 
  box-sizing: border-box;
  background-color: #000000;
}

/* 4. TESTATA SUPERIORE SFOCATA (Stile Amazon/Apple) */
.app-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  background-color: rgba(0, 0, 0, 0.6); 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px); /* Compatibilità iOS */
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  padding-top: env(safe-area-inset-top, 20px); 
  padding-bottom: 12px;
  text-align: center;
}
.app-header h2 {
  margin: 0;
  font-size: 16px;
  letter-spacing: 0.5px;
  color: #ffffff;
}

/* 5. BARRA INFERIORE FISSA - MASCHERA DI CONTINUITÀ VUOTA */
.app-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  background-color: rgba(0, 0, 0, 0.6); 
  backdrop-filter: blur(20px);           
  -webkit-backdrop-filter: blur(20px);   
  border-top: 1px solid rgba(255, 255, 255, 0.03); 
  
  /* L'altezza si adatta al millimetro solo alla Safe Area dello smartphone */
  height: env(safe-area-inset-bottom, 0px); 
}
</style>
</head>
<body>

  <!-- SCHERMATA DI BENVENUTO (Si vede solo se aperta nel normale browser) -->
  <div id="welcomeScreen" class="welcome-screen">
    <h2>The Cult Movies Collector</h2>
    <p>Per avviare l'applicazione a schermo intero senza barre del browser, aggiungila alla schermata Home del tuo telefono e aprila da lì.</p>
    <a href="https://script.google.com/macros/s/AKfycbxYFekITzqlN8TMB8PBukJxOYydrzkO2oFlY7t6w-rHMSyDf_prx0fg86uks28FFdGb/exec" class="btn-install">
      Apri nel Browser
    </a>
  </div>

  <!-- INTERFACCIA APP NATIVA (Si attiva solo quando viene aperta dalla Home dello schermo) -->
  <div id="appInterface" class="app-container">
    <!-- Testata sfocata fissa che copre l'ora e la batteria -->
    <header class="app-header">
    </header>

    <!-- La tua applicazione Google ospitata in modo protetto all'interno della PWA -->
    <iframe class="app-frame" src="https://script.google.com/macros/s/AKfycbxYFekITzqlN8TMB8PBukJxOYydrzkO2oFlY7t6w-rHMSyDf_prx0fg86uks28FFdGb/exec"></iframe>

<!-- Il tuo footer aggiornato -->
<footer class="app-footer">
</footer>
  </div>

<script>
  // Controllo intelligente: l'utente ha aperto l'app dall'icona della Home (standalone)?
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    // Nascondiamo il messaggio di benvenuto e mostriamo l'interfaccia dell'app a schermo intero
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('appInterface').style.display = 'block';
  }
</script>

</body>
</html>
