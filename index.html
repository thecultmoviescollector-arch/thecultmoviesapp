<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Cult Movies Collector</title>

    <!-- Favicon Standard per Browser Desktop (Usa le tue icone) -->
    <link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1">

    <!-- Supporto per Apple iOS (La riga del tuo test funzionante adattata al tuo file) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- CAMBIATO: da black-translucent a black. Questo evita che iOS sovrapponga l'app alla barra di stato nera di sistema -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="TheCultMoviesApp">

    <!-- Collegamento al Manifest per Android, Chrome e altri browser -->
    <link rel="manifest" href="manifest.json?v=1">

    <!-- Colore della barra del browser su Android -->
    <meta name="theme-color" content="#000000">

    <style>
        /* Gestione millimetrica dello spazio sullo schermo */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            height: 100vh;
            overflow: hidden; 
            background-color: #000000;
            box-sizing: border-box;
        }
        
        iframe { 
            width: 100%; 
            height: 100%;
            border: none; 
            display: block;
            
            /* Gestione dello spazio sicuro per evitare che l'app scivoli sotto la barra della batteria/ora */
            padding-top: env(safe-area-inset-top, 0px);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Ricordati di rimettere il tuo URL reale di Google Apps Script (lascia le virgolette) -->
    <iframe src="IL_TUO_URL_DI_GOOGLE_APPS_SCRIPT_QUI"></iframe>

</body>
</html>
